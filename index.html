<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suivi des Achats — Calendrier</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🛒 Suivi des Achats</h1>
    <p class="subtitle">Notez vos achats jour par jour : nombre d'achats et montant dépensé.</p>
  </header>

  <main class="container">
    <section class="calendar-card">
      <div class="calendar-toolbar">
        <button id="prevMonth" class="btn nav-btn" aria-label="Mois précédent">←</button>
        <h2 id="monthLabel" class="month-label"></h2>
        <button id="nextMonth" class="btn nav-btn" aria-label="Mois suivant">→</button>
      </div>

      <div class="calendar-grid weekdays">
        <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div>
        <div>Ven</div><div>Sam</div><div>Dim</div>
      </div>
      <div id="calendarGrid" class="calendar-grid days"></div>
    </section>

    <section class="summary-card">
      <h3>Résumé du mois</h3>
      <div class="summary-stats">
        <div class="stat">
          <span class="stat-value" id="totalPurchases">0</span>
          <span class="stat-label">Achats</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="totalAmount">0,00 €</span>
          <span class="stat-label">Montant total</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="avgAmount">0,00 €</span>
          <span class="stat-label">Panier moyen</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="activeDays">0</span>
          <span class="stat-label">Jours avec achats</span>
        </div>
      </div>
      <div class="summary-actions">
        <button id="exportBtn" class="btn secondary">Exporter (CSV)</button>
        <button id="clearMonthBtn" class="btn danger">Vider ce mois</button>
      </div>
    </section>
  </main>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modalDate">Jour</h3>
      <form id="entryForm">
        <label for="purchaseCount">Nombre d'achats</label>
        <input type="number" id="purchaseCount" min="0" step="1" placeholder="Ex : 3" required />

        <label for="purchaseAmount">Montant (€)</label>
        <input type="number" id="purchaseAmount" min="0" step="0.01" placeholder="Ex : 24,50" required />

        <div class="modal-actions">
          <button type="button" id="deleteEntry" class="btn danger hidden">Supprimer</button>
          <button type="button" id="cancelEntry" class="btn secondary">Annuler</button>
          <button type="submit" class="btn primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="app-footer">
    <p>Les données sont enregistrées localement dans votre navigateur.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
